<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="pgrad-AshfaqullaKhan" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stopColor="#1E293B"/>
      <stop offset="65%" stopColor="#0B0F19"/>
      <stop offset="100%" stopColor="#030509"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pgrad-AshfaqullaKhan)"/>

  <!-- Halo & Sacred Rings -->
  <circle cx="300" cy="300" r="180" fill="none" stroke="#138808" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="300" cy="300" r="140" fill="#138808" fill-opacity="0.08"/>
  <circle cx="300" cy="300" r="100" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.2"/>

  <!-- Emblematic Silhouette -->
  <g transform="translate(300, 280)" fill="#138808" opacity="0.85">
    <circle cx="0" cy="-35" r="42" fill="none" stroke="#138808" stroke-width="3.5"/>
    <path d="M -65 80 C -65 15, 65 15, 65 80 Z" fill="none" stroke="#138808" stroke-width="3.5"/>
    <circle cx="0" cy="-35" r="9" fill="#138808"/>
    <circle cx="0" cy="30" r="6" fill="#138808"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="300" y="520" font-family="'IBM Plex Mono', monospace" font-size="13" fill="#138808" letter-spacing="4" font-weight="700">MARTYR OF UNITY</text>
    <text x="300" y="570" font-family="'Fraunces', Georgia, serif" font-size="34" fill="#F4F1E9" font-weight="600">Ashfaqulla Khan</text>
    <text x="300" y="615" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#94A3B8" letter-spacing="2">1900 – 1927</text>
    <text x="300" y="655" font-family="Georgia, serif" font-size="16" fill="#CBD5E1" font-style="italic">Co-founder of HRA & Kakori Martyr</text>
  </g>

  <rect x="20" y="20" width="560" height="760" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>
  <rect x="28" y="28" width="544" height="744" fill="none" stroke="#138808" stroke-width="0.6" opacity="0.4"/>
